name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK & Command Line Tools
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/licenses"

          SDKMANAGER_BIN=$(find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -n 1 || true)

          if [ -z "$SDKMANAGER_BIN" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          chmod +x "$SDKMANAGER_BIN"
          SDK_DIR_PATH=$(dirname "$(dirname "$SDKMANAGER_BIN")")
          PLATFORM_TOOLS_DIR="$ANDROID_HOME/platform-tools"
          echo "PATH=$SDK_DIR_PATH/bin:$PLATFORM_TOOLS_DIR:$PATH" >> $GITHUB_ENV

          set +o pipefail
          yes | "$SDKMANAGER_BIN" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER_BIN" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin --no-daemon
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: battery-monitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
